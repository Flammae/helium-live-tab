<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="fx-defs" width="0" height="0" aria-hidden="true">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage href="lens.png" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="backdrop" aria-hidden="true"></div>
  <video id="bg" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
  <div class="scrim" aria-hidden="true"></div>

  <main class="stage">
    <div class="bookmarks-slot">
      <section class="panel is-booting" id="panel" aria-label="Bookmarks" aria-busy="true">
        <div class="chrome-stub" hidden>
          <div class="roots" id="roots" role="tablist" aria-label="Bookmark locations"></div>
          <label class="filter" id="filter">
            <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Filter bookmarks">
          </label>
          <button class="icon-btn" id="manage" type="button" aria-label="Open bookmark manager"></button>
          <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
          <footer class="panel-foot" id="foot"></footer>
        </div>
        <div class="panel-scroll" id="panelScroll">
          <section class="chip-section group" id="openTabs" aria-label="Open tabs" hidden>
            <h3 class="group-label">Open tabs</h3>
            <div class="open-tabs-list" id="openTabsList" role="list"></div>
          </section>
          <section class="chip-section group" id="recent" aria-label="Recently closed" hidden>
            <h3 class="group-label">Recently closed</h3>
            <div class="recent-list" id="recentList" role="list"></div>
          </section>
          <div class="panel-body" id="body"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="newtab.js"></script>
</body>
</html>
