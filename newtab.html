<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <video id="bg" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
  <div class="scrim" aria-hidden="true"></div>

  <main class="stage">
    <div class="bookmarks-slot">
      <section class="panel is-booting" id="panel" aria-label="Bookmarks" aria-busy="true">
        <div class="chrome-stub" hidden>
          <div class="roots" id="roots" role="tablist" aria-label="Bookmark locations"></div>
          <button class="icon-btn" id="manage" type="button" aria-label="Open bookmark manager"></button>
          <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
          <footer class="panel-foot" id="foot"></footer>
        </div>
        <div class="panel-scroll" id="panelScroll" tabindex="-1">
          <section class="chip-section group" id="openTabs" aria-label="Open tabs" hidden>
            <h3 class="group-label"><span class="group-label-text">Open tabs</span></h3>
            <div class="open-tabs-list" id="openTabsList" role="list"></div>
          </section>
          <section class="chip-section group" id="recent" aria-label="Recently closed" hidden>
            <h3 class="group-label"><span class="group-label-text">Recently closed</span></h3>
            <div class="recent-strip">
              <div class="recent-list" id="recentList" role="list" tabindex="-1"></div>
            </div>
          </section>
          <div class="panel-body" id="body"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="newtab.js"></script>
</body>
</html>
